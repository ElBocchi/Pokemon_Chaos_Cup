<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Chaos Cup - Elite Precision</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --turq: #00f5ff; --purp: #bc13fe; --poke-red: #ff1f1f; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%); }
        .container { background: rgba(10, 10, 10, 0.95); border: 2px solid var(--turq); box-shadow: 0 0 30px rgba(0, 245, 255, 0.2); border-radius: 30px; padding: 30px; width: 90%; max-width: 420px; text-align: center; position: relative; backdrop-filter: blur(10px); }
        h1 { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 15px var(--turq); font-size: 1.6em; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; box-sizing: border-box; background: #111; border: 1px solid var(--purp); color: var(--turq); border-radius: 10px; font-family: 'Orbitron', sans-serif; text-align: center; }
        .btn { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 50px; font-family: 'Orbitron', sans-serif; font-weight: 900; cursor: pointer; background: linear-gradient(45deg, var(--purp), #7a09aa); color: white; box-shadow: 0 5px 15px rgba(188, 19, 254, 0.4); transition: 0.2s; }
        .btn:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 0 20px var(--turq); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .wheel-box { position: relative; width: 320px; height: 320px; margin: 20px auto; border: 8px solid #222; border-radius: 50%; box-shadow: 0 0 25px var(--purp); overflow: visible; }
        .wheel-box::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: white; border: 5px solid #222; border-radius: 50%; z-index: 5; box-shadow: 0 0 10px white; }
        canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 6s cubic-bezier(0.2, 0, 0.1, 1); }
        .pointer { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; z-index: 10; filter: drop-shadow(0 0 5px var(--turq)); }
        #status-msg { font-size: 0.8em; color: var(--turq); margin-bottom: 15px; font-weight: bold; padding: 8px; border: 1px dashed var(--turq); text-transform: uppercase; }
        #result-display { font-family: 'Orbitron', sans-serif; font-size: 1.2em; margin-top: 15px; min-height: 1.2em; color: white; text-shadow: 0 0 10px var(--turq); }
    </style>
</head>
<body>

    <div id="login-screen" class="container">
        <div style="font-size: 2.5em; margin-bottom: 10px;">🛡️</div>
        <h1>POKEMON CHAOS</h1>
        <input type="text" id="user-in" placeholder="ENTRENADOR">
        <input type="password" id="pass-in" placeholder="CONTRASEÑA">
        <button class="btn" onclick="login()">ENTRAR</button>
    </div>

    <div id="app-screen" class="container hidden">
        <div id="status-msg">CUP SISTEMA ACTIVO</div>
        <div class="wheel-box">
            <svg class="pointer" viewBox="0 0 40 40"><path d="M20 40 L5 10 L35 10 Z" fill="#00f5ff" /></svg>
            <canvas id="wheel" width="600" height="600"></canvas>
        </div>
        <input type="password" id="ticket-in" placeholder="INGRESAR TICKET MAESTRO">
        <button class="btn" id="spin-btn" onclick="spin()">GIRAR RULETA</button>
        <div id="result-display"></div>
        <button onclick="location.reload()" style="background:none; border:none; color:#444; cursor:pointer; margin-top:20px; font-size:0.7em;">CERRAR SESIÓN</button>
    </div>

    <script>
        const MASTER_TICKET = "BLUE";
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1465016757910769705/ODWb5Q5vgXxN3POMZ6-znJ_lX_-tMHQ5LxvS6HYZBHe5o3QvxdVU5kuXuZjSpxxieESG";

        // ORDEN ESTRATÉGICO PARA QUE NINGÚN RANGO IGUAL ESTÉ JUNTO
        const PREMIOS = [
            {n: "Hero’s Never Die", r: "SS", color: "#ff1f1f", w: 3},
            {n: "Recaptura Avanzada", r: "B", color: "#00f5ff", w: 25},
            {n: "Revivir Pokémon", r: "A", color: "#bc13fe", w: 10},
            {n: "Robo de Pokémon", r: "S", color: "#ff8000", w: 7},
            {n: "Infinidad", r: "B", color: "#00f5ff", w: 25},
            {n: "EGOist", r: "SS", color: "#ff1f1f", w: 4},
            {n: "Skip Pokémon", r: "B", color: "#00f5ff", w: 25},
            {n: "Cambio de Suerte", r: "A", color: "#bc13fe", w: 10},
            {n: "Randomlocke Rainbow", r: "S", color: "#ff8000", w: 7},
            {n: "Bufón", r: "B", color: "#00f5ff", w: 25},
            {n: "Alteración Genética", r: "SS", color: "#ff1f1f", w: 3},
            {n: "Sepulturero", r: "A", color: "#bc13fe", w: 10},
            {n: "Banhammer", r: "S", color: "#ff8000", w: 7},
            {n: "Escudo Protector", r: "B", color: "#00f5ff", w: 25},
            {n: "Gachapón", r: "A", color: "#bc13fe", w: 10},
            {n: "Trueque", r: "B", color: "#00f5ff", w: 25},
            {n: "Debug", r: "A", color: "#bc13fe", w: 10},
            {n: "Reversa", r: "A", color: "#bc13fe", w: 10}
        ];

        let users = JSON.parse(localStorage.getItem('cup_v11_users')) || [];
        let activeUser = null;

        function login() {
            const u = document.getElementById('user-in').value.trim().toUpperCase();
            const p = document.getElementById('pass-in').value.trim();
            if(!u || !p) return;
            let user = users.find(x => x.name === u);
            if(!user) { user = { name: u, pass: p, lastFree: null }; users.push(user); save(); }
            else if(user.pass !== p) { alert("DATOS INCORRECTOS"); return; }
            activeUser = user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            checkStatus(); draw();
        }

        function checkStatus() {
            const hoy = new Date().toDateString();
            const esImpar = (new Date().getDate() % 2 !== 0);
            const yaGiro = (activeUser.lastFree === hoy);
            document.getElementById('status-msg').innerText = (esImpar && !yaGiro) ? "GIRO DIARIO: DISPONIBLE" : "BLOQUEO: REQUIERE TICKET";
        }

        function spin() {
            const hoy = new Date().toDateString();
            const esImpar = (new Date().getDate() % 2 !== 0);
            const yaGiro = (activeUser.lastFree === hoy);
            const tk = document.getElementById('ticket-in').value.trim();

            let esLibre = (esImpar && !yaGiro);
            if (!esLibre && tk !== MASTER_TICKET) { alert("Ticket no válido o ya usado."); return; }

            const btn = document.getElementById('spin-btn');
            btn.disabled = true;
            document.getElementById('ticket-in').value = "";
            document.getElementById('result-display').innerText = "CALCULANDO PREMIO...";

            // 1. Probabilidades reales
            const totalW = PREMIOS.reduce((s, i) => s + i.w, 0);
            let randW = Math.random() * totalW;
            let winIndex = 0;
            for(let i=0; i<PREMIOS.length; i++) {
                if(randW < PREMIOS[i].w) { winIndex = i; break; }
                randW -= PREMIOS[i].w;
            }
            const win = PREMIOS[winIndex];

            // 2. Cálculo matemático exacto para que la flecha coincida con el premio
            const slice = 360 / PREMIOS.length;
            // El ángulo base 270 es porque el puntero está en la parte superior del canvas
            const targetDeg = (360 * 8) + (270 - (winIndex * slice) - (slice / 2));

            const canvas = document.getElementById('wheel');
            canvas.style.transform = `rotate(${targetDeg}deg)`;

            setTimeout(() => {
                document.getElementById('result-display').innerHTML = `¡PREMIO: <span style="color:${win.color}">${win.n}</span>!`;
                if (esLibre) activeUser.lastFree = hoy;
                save();
                fetch(DISCORD_WEBHOOK, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({content: `🎰 **${activeUser.name}** obtuvo: **${win.n}** [${win.r}]` }) }).catch(()=>{});
                checkStatus();
                btn.disabled = false;
                
                // Reset suave de rotación para evitar saltos
                setTimeout(() => {
                    canvas.style.transition = "none";
                    canvas.style.transform = `rotate(${targetDeg % 360}deg)`;
                    setTimeout(() => canvas.style.transition = "transform 6s cubic-bezier(0.2, 0, 0.1, 1)", 50);
                }, 100);
            }, 6100);
        }

        function save() { localStorage.setItem('cup_v11_users', JSON.stringify(users)); }

        function draw() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const arc = Math.PI * 2 / PREMIOS.length;
            for(let i=0; i<PREMIOS.length; i++) {
                ctx.fillStyle = (i % 2 === 0) ? "#0a0a0a" : "#111";
                ctx.beginPath(); ctx.moveTo(300, 300);
                ctx.arc(300, 300, 300, i * arc, (i + 1) * arc);
                ctx.fill();
                ctx.strokeStyle = "#222"; ctx.stroke();
                
                ctx.save();
                ctx.translate(300, 300);
                ctx.rotate(i * arc + arc / 2);
                ctx.fillStyle = PREMIOS[i].color;
                ctx.font = "bold 20px Orbitron";
                ctx.fillText(PREMIOS[i].r, 190, 8);
                ctx.restore();
            }
        }
    </script>
</body>
</html>
