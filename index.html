<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Chaos Cup - Ticket Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --turq: #00f5ff; --purp: #bc13fe; --bg: #000000; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(188, 19, 254, 0.05) 3px); }
        .container { background: rgba(5, 5, 5, 0.95); border: 2px solid var(--purp); box-shadow: 0 0 20px var(--purp); border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--turq); text-shadow: 0 0 10px var(--turq); font-size: 1.4em; }
        input { width: 85%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid var(--purp); color: var(--turq); border-radius: 5px; font-family: 'Orbitron', sans-serif; text-align: center; }
        .btn { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 50px; font-family: 'Orbitron', sans-serif; font-weight: bold; cursor: pointer; background: var(--purp); color: white; box-shadow: 0 0 10px var(--purp); }
        .btn:hover:not(:disabled) { background: var(--turq); color: black; box-shadow: 0 0 20px var(--turq); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .wheel-box { position: relative; width: 250px; height: 250px; margin: 20px auto; border: 4px solid var(--turq); border-radius: 50%; }
        canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--turq); z-index: 10; }
        .hidden { display: none !important; }
        .wallet { background: #111; padding: 10px; border-radius: 10px; border: 1px dashed var(--turq); margin-bottom: 10px; }
        #ticket-count { color: var(--turq); font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

    <div id="login-screen" class="container">
        <h1>POKEMON CHAOS CUP</h1>
        <input type="text" id="user-in" placeholder="ENTRENADOR">
        <input type="password" id="pass-in" placeholder="CONTRASEÑA">
        <button class="btn" onclick="login()">ENTRAR / REGISTRARSE</button>
    </div>

    <div id="app-screen" class="container hidden">
        <div class="wallet">
            GIROS DISPONIBLES: <span id="ticket-count">0</span>
        </div>
        
        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheel" width="500" height="500"></canvas>
        </div>

        <div id="redeem-area">
            <input type="password" id="ticket-in" placeholder="CANJEAR CÓDIGO TICKET">
            <button class="btn" style="padding: 10px; font-size: 0.8em;" onclick="redeemTicket()">CANJEAR TICKET</button>
        </div>

        <button class="btn" id="spin-btn" onclick="spin()" style="margin-top: 20px;">GIRAR RULETA (-1 GIRO)</button>
        <div id="result-display" style="margin-top: 15px; font-weight: bold; color: var(--turq);"></div>
        <button onclick="location.reload()" style="background:none; border:none; color:gray; cursor:pointer; margin-top:20px; font-size:0.7em;">LOGOUT</button>
    </div>

    <script>
        const MASTER_TICKET = "BOCCHI-ROCK"; 
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1465016757910769705/ODWb5Q5vgXxN3POMZ6-znJ_lX_-tMHQ5LxvS6HYZBHe5o3QvxdVU5kuXuZjSpxxieESG"; 

        let PREMIOS = [
            {n: "Hero’s Never Die", r: "SS", w: 1}, {n: "Alteración Genética", r: "SS", w: 1}, {n: "EGOist", r: "SS", w: 1},
            {n: "Robo de Pokémon", r: "S", w: 4}, {n: "Randomlocke Rainbow", r: "S", w: 4}, {n: "Banhammer", r: "S", w: 4},
            {n: "Gachapón", r: "A", w: 10}, {n: "Revivir Pokémon", r: "A", w: 10}, {n: "Cambio de Suerte", r: "A", w: 10},
            {n: "Reversa", r: "A", w: 10}, {n: "Debug", r: "A", w: 10}, {n: "Sepulturero", r: "A", w: 10},
            {n: "Bufón", r: "B", w: 25}, {n: "Recaptura Avanzada", r: "B", w: 25}, {n: "Infinidad", r: "B", w: 25},
            {n: "Skip Pokémon", r: "B", w: 25}, {n: "Escudo Protector", r: "B", w: 25}, {n: "Trueque", r: "B", w: 25}
        ].sort(() => Math.random() - 0.5);

        let users = JSON.parse(localStorage.getItem('cup_v7_users')) || [];
        let activeUser = null;

        function login() {
            const u = document.getElementById('user-in').value.trim();
            const p = document.getElementById('pass-in').value.trim();
            if(!u || !p) return;

            let user = users.find(x => x.name === u);
            if(!user) {
                // Nuevo usuario con 1 giro gratis si es día impar, si no 0.
                const esImpar = (new Date().getDate() % 2 !== 0);
                user = { name: u, pass: p, tickets: esImpar ? 1 : 0, lastDaily: null };
                users.push(user);
                save();
            } else if(user.pass !== p) {
                alert("PASS INCORRECTA"); return;
            }

            activeUser = user;
            
            // Lógica de regalo diario (1 al día si es impar)
            const hoy = new Date().toDateString();
            const esImpar = (new Date().getDate() % 2 !== 0);
            if(esImpar && activeUser.lastDaily !== hoy) {
                activeUser.tickets += 1;
                activeUser.lastDaily = hoy;
                save();
                alert("¡Has recibido tu giro gratuito del día impar!");
            }

            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            updateUI();
            draw();
        }

        function updateUI() {
            document.getElementById('ticket-count').innerText = activeUser.tickets;
            document.getElementById('spin-btn').disabled = (activeUser.tickets <= 0);
        }

        function redeemTicket() {
            const val = document.getElementById('ticket-in').value.trim();
            if(val === MASTER_TICKET) {
                activeUser.tickets += 1;
                save();
                updateUI();
                document.getElementById('ticket-in').value = "";
                alert("¡Ticket canjeado! +1 Giro añadido.");
            } else {
                alert("CÓDIGO INVÁLIDO");
            }
        }

        function spin() {
            if(activeUser.tickets <= 0) return;

            const btn = document.getElementById('spin-btn');
            btn.disabled = true;
            activeUser.tickets -= 1; // RESTAR TICKET AL GIRAR
            save();
            updateUI();

            const deg = Math.floor(5000 + Math.random() * 5000);
            document.getElementById('wheel').style.transform = `rotate(${deg}deg)`;

            const total = PREMIOS.reduce((s,i) => s + i.w, 0);
            let r = Math.random() * total;
            let win = PREMIOS[0];
            for(let i of PREMIOS) { if(r < i.w) { win = i; break; } r -= i.w; }

            setTimeout(() => {
                document.getElementById('result-display').innerText = `¡HAS GANADO: ${win.n}!`;
                
                fetch(DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: `🎰 **${activeUser.name}** usó un giro.\n**Premio:** ${win.n}\n**Quedan:** ${activeUser.tickets} giros.`})
                }).catch(() => {});

                if(activeUser.tickets > 0) btn.disabled = false;
            }, 4100);
        }

        function save() { localStorage.setItem('cup_v7_users', JSON.stringify(users)); }

        function draw() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const arc = Math.PI * 2 / PREMIOS.length;
            for(let i=0; i<PREMIOS.length; i++) {
                ctx.fillStyle = (i % 2 === 0) ? "#000" : "#080808";
                ctx.beginPath(); ctx.moveTo(250,250);
                ctx.arc(250, 250, 250, i*arc, (i+1)*arc);
                ctx.fill();
                ctx.strokeStyle = "#bc13fe"; ctx.stroke();
                ctx.save(); ctx.translate(250,250); ctx.rotate(i*arc + arc/2);
                ctx.fillStyle = "#00f5ff"; ctx.font = "bold 18px Orbitron";
                ctx.fillText(PREMIOS[i].r, 185, 8); ctx.restore();
            }
        }
    </script>
</body>
</html>
