<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Chaos Cup - Calendario Real</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        :root { --turq: #00f5ff; --purp: #bc13fe; --bg: #000000; }
        body { background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(188, 19, 254, 0.05) 3px); }
        .container { background: rgba(5, 5, 5, 0.95); border: 2px solid var(--purp); box-shadow: 0 0 20px var(--purp); border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--turq); text-shadow: 0 0 10px var(--turq); font-size: 1.5em; }
        input { width: 85%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid var(--purp); color: var(--turq); border-radius: 5px; font-family: 'Orbitron', sans-serif; text-align: center; }
        .btn { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 50px; font-family: 'Orbitron', sans-serif; font-weight: bold; cursor: pointer; background: var(--purp); color: white; box-shadow: 0 0 10px var(--purp); }
        .btn:hover { background: var(--turq); color: black; }
        .wheel-box { position: relative; width: 250px; height: 250px; margin: 20px auto; border: 4px solid var(--turq); border-radius: 50%; }
        canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--turq); z-index: 10; }
        .hidden { display: none !important; }
        #status-msg { font-size: 0.8em; color: var(--turq); margin-bottom: 10px; font-weight: bold; }
        #result-display { font-family: 'Orbitron', sans-serif; color: var(--turq); margin-top: 15px; font-size: 1.1em; }
    </style>
</head>
<body>

    <div id="login-screen" class="container">
        <h1>POKEMON CHAOS CUP</h1>
        <input type="text" id="user-in" placeholder="ENTRENADOR">
        <input type="password" id="pass-in" placeholder="CONTRASEÑA">
        <button class="btn" onclick="login()">ENTRAR / REGISTRARSE</button>
        <p id="cupos" style="font-size: 0.8em; margin-top:10px; color: var(--purp);"></p>
    </div>

    <div id="app-screen" class="container hidden">
        <div id="status-msg"></div>
        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheel" width="500" height="500"></canvas>
        </div>
        <div id="ticket-area" class="hidden">
            <input type="password" id="ticket-in" placeholder="INGRESA TICKET MAESTRO">
        </div>
        <button class="btn" id="spin-btn" onclick="spin()">GIRAR RULETA</button>
        <div id="result-display"></div>
        <button onclick="location.reload()" style="background:none; border:none; color:gray; cursor:pointer; margin-top:20px; font-size:0.7em;">CERRAR SESIÓN</button>
    </div>

    <div id="admin-screen" class="container hidden">
        <h1>CENTRAL ADMIN</h1>
        <div id="admin-log" style="text-align: left; font-size: 0.8em; max-height: 300px; overflow-y: auto;"></div>
        <button class="btn" onclick="location.reload()">VOLVER</button>
    </div>

    <script>
        // CONFIGURACIÓN CENTRAL
        const MASTER_TICKET = "BOCCHI-ROCK"; 
        const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1465016757910769705/ODWb5Q5vgXxN3POMZ6-znJ_lX_-tMHQ5LxvS6HYZBHe5o3QvxdVU5kuXuZjSpxxieESG"; 

        let PREMIOS = [
            {n: "Hero’s Never Die", r: "SS", w: 1}, {n: "Alteración Genética", r: "SS", w: 1}, {n: "EGOist", r: "SS", w: 1},
            {n: "Robo de Pokémon", r: "S", w: 4}, {n: "Randomlocke Rainbow", r: "S", w: 4}, {n: "Banhammer", r: "S", w: 4},
            {n: "Gachapón", r: "A", w: 10}, {n: "Revivir Pokémon", r: "A", w: 10}, {n: "Cambio de Suerte", r: "A", w: 10},
            {n: "Reversa", r: "A", w: 10}, {n: "Debug", r: "A", w: 10}, {n: "Sepulturero", r: "A", w: 10},
            {n: "Bufón", r: "B", w: 25}, {n: "Recaptura Avanzada", r: "B", w: 25}, {n: "Infinidad", r: "B", w: 25},
            {n: "Skip Pokémon", r: "B", w: 25}, {n: "Escudo Protector", r: "B", w: 25}, {n: "Trueque", r: "B", w: 25}
        ].sort(() => Math.random() - 0.5);

        let users = JSON.parse(localStorage.getItem('bocchi_v5_users')) || [];
        let logs = JSON.parse(localStorage.getItem('bocchi_v5_logs')) || [];
        let activeUser = null;

        document.getElementById('cupos').innerText = `JUGADORES: ${users.length} / 13`;

        function login() {
            const u = document.getElementById('user-in').value.trim();
            const p = document.getElementById('pass-in').value.trim();
            if(!u || !p) return;

            if(u === "BocchiAdmin" && p === "Luna288") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-screen').classList.remove('hidden');
                document.getElementById('admin-log').innerHTML = logs.map(l => `<p><b>${l.user}:</b> ${l.prize} (${l.time})</p>`).join('');
                return;
            }

            let user = users.find(x => x.name === u);
            if(!user) {
                if(users.length >= 13) { alert("SISTEMA LLENO"); return; }
                user = { name: u, pass: p, last: null };
                users.push(user);
                localStorage.setItem('bocchi_v5_users', JSON.stringify(users));
            } else if(user.pass !== p) {
                alert("CONTRASEÑA INCORRECTA"); return;
            }

            activeUser = user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            draw();
            checkCalendar();
        }

        function checkCalendar() {
            const hoy = new Date();
            const diaDelMes = hoy.getDate();
            const esImpar = (diaDelMes % 2 !== 0);
            const yaGiroHoy = (activeUser.last === hoy.toDateString());
            
            const msg = document.getElementById('status-msg');
            const ticketArea = document.getElementById('ticket-area');

            if (!esImpar) {
                msg.innerText = `HOY ES DÍA ${diaDelMes} (PAR): BLOQUEADO`;
                ticketArea.classList.remove('hidden');
            } else if (yaGiroHoy) {
                msg.innerText = "YA RECLAMASTE TU GIRO GRATIS DE HOY";
                ticketArea.classList.remove('hidden');
            } else {
                msg.innerText = `HOY ES DÍA ${diaDelMes} (IMPAR): ¡GIRO GRATIS DISPONIBLE!`;
                ticketArea.classList.add('hidden');
            }
        }

        function spin() {
            const hoy = new Date();
            const esImpar = (hoy.getDate() % 2 !== 0);
            const yaGiroHoy = (activeUser.last === hoy.toDateString());

            // Si es día par o ya giró, validar ticket
            if(!esImpar || yaGiroHoy) {
                const tk = document.getElementById('ticket-in').value.trim();
                if(tk !== MASTER_TICKET) {
                    alert("CÓDIGO INCORRECTO: Hoy no es día de giro gratis o ya usaste el tuyo.");
                    return;
                }
            }

            const btn = document.getElementById('spin-btn');
            btn.disabled = true;
            document.getElementById('result-display').innerText = "GIRANDO...";

            const deg = Math.floor(3600 + Math.random() * 360);
            document.getElementById('wheel').style.transform = `rotate(${deg}deg)`;

            const total = PREMIOS.reduce((s,i) => s + i.w, 0);
            let r = Math.random() * total;
            let win = PREMIOS[0];
            for(let i of PREMIOS) { if(r < i.w) { win = i; break; } r -= i.w; }

            setTimeout(() => {
                document.getElementById('result-display').innerText = `¡HAS OBTENIDO: ${win.n}!`;
                activeUser.last = hoy.toDateString();
                logs.unshift({ user: activeUser.name, prize: win.n, time: hoy.toLocaleTimeString() });
                localStorage.setItem('bocchi_v5_logs', JSON.stringify(logs));
                localStorage.setItem('bocchi_v5_users', JSON.stringify(users));
                
                fetch(DISCORD_WEBHOOK, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: `🎰 **${activeUser.name}** ha girado la ruleta:\n**Premio:** ${win.n}\n**Rango:** ${win.r}`})
                }).catch(() => {});

                btn.disabled = false;
                checkCalendar();
                document.getElementById('ticket-in').value = ""; // Limpiar ticket usado
            }, 4000);
        }

        function draw() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const arc = Math.PI * 2 / PREMIOS.length;
            for(let i=0; i<PREMIOS.length; i++) {
                ctx.fillStyle = (i % 2 === 0) ? "#000" : "#0f0f0f";
                ctx.beginPath(); ctx.moveTo(250,250);
                ctx.arc(250, 250, 250, i*arc, (i+1)*arc);
                ctx.fill();
                ctx.strokeStyle = "#bc13fe"; ctx.stroke();
                ctx.save(); ctx.translate(250,250); ctx.rotate(i*arc + arc/2);
                ctx.fillStyle = "#00f5ff"; ctx.font = "bold 18px Orbitron";
                ctx.fillText(PREMIOS[i].r, 180, 10); ctx.restore();
            }
        }
    </script>
</body>
</html>
